<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warhead</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sea:#080d13; --sea2:#0d161f; --land:#18232d; --land2:#1e2b37; --coast:#3b4d5e; --grid:#101a24;
  --ink:#d6dee6; --muted:#7a8c9e; --faint:#3d4c5b; --panel:#0c1218; --panel2:#111a22; --line:#1b2632;
  --enemy:#ff5a3c; --dead:#3f4d5a; --white:#f7fafc;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sea:#080d13; } }
:root[data-theme="dark"]{ --sea:#080d13; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:17px;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto}
#mapwrap{grid-column:1;grid-row:1;position:relative;min-height:0;background:var(--sea)}
canvas{display:block;width:100%;height:100%;cursor:default;touch-action:none;user-select:none;-webkit-user-select:none}

#demoCap{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:6;width:min(720px,90%);box-sizing:border-box;padding:18px 22px;background:rgba(10,15,21,.95);border:1px solid #2a3a4a;border-radius:2px;display:flex;align-items:center;gap:18px}
#demoCap.off{display:none}
#demoCap p{margin:0;flex:1;font-size:20px;line-height:1.35;color:var(--white);font-weight:500}
#demoCap .dbtns{display:flex;gap:8px}
#demoCap button{height:42px;width:96px;font-size:17px}
#cmenu{position:absolute;z-index:3;display:flex;flex-direction:column;gap:5px;padding:8px;background:rgba(12,18,24,.96);border:1px solid #2a3a4a;border-radius:2px}
#cmenu.off{display:none}
#cmenu .mt{font-size:15px;color:var(--muted);padding:0 2px 4px;white-space:nowrap}
#cmenu .mt2{font-size:15px;color:var(--white);padding:0 2px 6px;white-space:nowrap;margin-top:-4px}
#cmenu button{height:32px;width:auto;min-width:150px;font-size:16px;text-align:left;padding:0 12px}
#cmenu .mh{font-size:17px;font-weight:700;color:var(--white);padding:0 2px;white-space:nowrap}
#cmenu .mt{padding:0 2px 2px}
#city{flex:0 1 auto!important}
#feed{display:none!important;flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 20px;border-top:1px solid var(--line)}
#feed .ft{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:10px 0 6px}
#feed .ft:first-child{margin-top:0}
#feed .fi{font-size:16px;line-height:1.35;color:var(--white);margin:0 0 6px}
#feed .fi.enemy{color:var(--enemy)}
#feed .fi.quiet{color:var(--muted)}
#feed .old .fi{opacity:.6}
#tips{position:absolute;left:16px;right:16px;top:14px;z-index:4;display:flex;align-items:center;gap:16px;min-height:52px;box-sizing:border-box;padding:8px 16px;background:rgba(17,26,34,.94);border:1px solid var(--line);border-radius:2px;overflow:hidden}
#tips p{margin:0;flex:1;font-size:18px;line-height:1.35;color:var(--white);font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#tips button{flex:0 0 auto;height:34px;font-size:15px;font-weight:500;padding:0 12px;color:var(--muted)}
#tips.hidden{display:none}
#bottom{grid-column:1;grid-row:2;display:flex;align-items:center;gap:20px;height:72px;box-sizing:border-box;padding:0 20px;background:var(--panel);border-top:1px solid var(--line)}
#info{flex:1;min-width:0;font-size:18px;color:var(--ink);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

#side{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#sideHead{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#sideTitle{font-size:24px;font-weight:700;color:var(--white)}
#sideSub{font-size:16px;color:var(--muted);margin-top:2px;min-height:20px}
#city{flex:1 1 auto;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
#city.empty > *{display:none}
#cityHead{display:flex;align-items:center;gap:10px}
#cityName{font-size:26px;font-weight:700;color:var(--white)}
#cityCount{font-size:20px;font-weight:600;color:var(--ink)}
.tag{font-size:13px;font-weight:600;color:var(--sea);background:var(--ink);padding:1px 6px;border-radius:2px;letter-spacing:.04em}
#cityLine{font-size:17px;color:var(--ink);line-height:1.35}
#ordBox{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 4px 0 12px;border:1px solid #2a3a4a;border-radius:2px}
#ordBox .lbl{width:44px}
#ordText{flex:1;font-size:18px;font-weight:600;color:var(--white)}
#ordText.none{color:var(--faint);font-weight:500}
#ordN{display:flex;gap:4px}
#ordN button{height:30px;width:30px;padding:0;font-size:18px}
#ordBox button.x{height:30px;width:30px;padding:0;border:0;font-size:18px;color:var(--muted)}
#mlist{display:flex;flex-direction:column;gap:6px}
#card{margin-top:6px;padding:14px;border:1px solid var(--line);border-radius:2px;background:#0a1017}
#card.off{display:none}
#cardArt{width:100%;height:70px;display:block;margin-bottom:10px}
#cardName{font-size:20px;font-weight:700;color:var(--white)}
#cardBody{font-size:15px;color:var(--ink);line-height:1.45;margin-top:4px}
#cardBody .k{color:var(--muted)}
.mrow{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 0 0 12px;border:1px solid var(--line);border-radius:2px;background:var(--panel2)}
.mrow .mname{font-size:17px;color:var(--ink);flex:0 0 112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.targeting{border-color:var(--white)}
.mrow .hint{font-size:16px;color:var(--white);flex:1}
.mrow .mord{font-size:17px;color:var(--white);flex:1}
.mrow button{height:32px;font-size:15px;padding:0 10px}
.mrow > button:not(.x){margin-left:auto;margin-right:4px}
.mrow button.x{border:0;width:32px;padding:0;font-size:18px;color:var(--muted);margin-left:auto}
.mrow button.x:hover{color:var(--white)}
.mrow .acts{display:flex;gap:6px;margin-left:auto;padding-right:4px}
#pendBox{display:inline-flex;align-items:baseline;gap:8px;justify-content:flex-end}
#pendBox.off{display:none}
#pendNum{font-size:44px;font-weight:700;line-height:1;color:var(--white);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
#pendLbl{font-size:16px;color:var(--muted)}
#ctxName{flex:0 0 220px;text-align:right;font-size:18px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnSlot{flex:0 0 350px;position:relative;height:50px}
#placeBox,#actBox{position:absolute;inset:0;display:flex;align-items:center;gap:8px}
#placeBox.off,#actBox.off{visibility:hidden}
#placeBox button{height:50px;width:171px;font-size:18px}
#actBox button{height:50px;width:111px;font-size:18px}
.mrow{cursor:pointer}
.mrow .mname{flex:1}
.mrow.sel{border-color:var(--muted);background:#182532}
.mrow .mord.none{color:var(--faint)}
#endWrap{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#endBtn{height:52px;font-size:20px}
#fsBtn{height:28px;font-size:14px;font-weight:500;color:var(--muted);border:0;align-self:center}

button{font-family:inherit;font-size:18px;font-weight:600;letter-spacing:.02em;height:44px;padding:0 12px;border:1px solid #2a3a4a;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;border-radius:2px}
button:hover{border-color:var(--muted)}
button:disabled{color:var(--faint);cursor:default;border-color:var(--line)}
button.active{background:transparent;color:var(--white);border:2px solid var(--white)}
button.go{background:var(--white);color:#06111a;border-color:var(--white)}
button.go:disabled{background:transparent;color:var(--faint);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--white);outline-offset:2px}

#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,13,19,.35) 0%,rgba(8,13,19,.92) 75%)}
#overlay .box{width:760px;max-width:92%;box-sizing:border-box;padding:40px 48px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:28px}
#overlay h1{margin:0;font-size:104px;line-height:.9;letter-spacing:.14em;text-indent:.14em;color:var(--white);font-weight:700}
#overlay .rule{width:220px;height:1px;background:var(--muted);margin:22px auto 18px;opacity:.6}
#overlay .quote{margin:0;font-size:22px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
#overlay .btns{display:flex;gap:10px;justify-content:center}
#overlay .btns button{width:200px}
body.cover #app{grid-template-columns:1fr}
body.cover #side,body.cover #tips,body.cover #bottom{display:none}

@media (max-width:1000px){
  #app{grid-template-columns:1fr}
  #overlay h1{font-size:64px}
}
</style>
</head>
<body class="cover">
<div id="app">
  <div id="mapwrap"><canvas id="c" aria-label="World map"></canvas><div id="timer" class="off"><div id="timerN"></div></div><div id="cmenu" class="off"></div><div id="plist" class="off"></div></div>
  <div id="panel">
    <div id="hud">
    <div id="tipRow" class="off"><p id="tipText"></p><button id="tipsOff" class="link">Hide tips</button></div>
    <div id="mainRow">
      <div id="clockBox"><div id="clockT"></div><div id="clockS"></div></div>
      <div id="info"></div>
      <div id="unit"><div id="unitName"></div><div id="unitSub"></div></div>
      <div id="verbs"><button id="bStrike">Strike</button><button id="bDefend">Defend</button><button id="bMove">Transport</button><button id="bHQ">Move HQ</button></div>
      <div id="sys"><button id="fsBtn" class="link">Full screen</button></div>
    </div>
    </div>
  </div>
  <div id="overlay">
    <div class="box">
      <div><h1 id="title">WARHEAD</h1><div class="rule"></div><p class="quote" id="sub">&ldquo;Peace through Strength&rdquo;</p></div>
      <div id="lobby">
        <div id="lbStart">
          <label for="lbName">Your name</label><input id="lbName" maxlength="16" autocomplete="off">
          <button class="go" id="lbCreate">Create a game</button>
          <div class="lbor">or join one</div>
          <div class="lbrow"><input id="lbCode" maxlength="4" placeholder="Code" autocomplete="off"><button id="lbJoin">Join</button></div>
          <p id="lbMsg"></p><p id="lbMode"></p>
        </div>
        <div id="lbRoom" class="off">
          <div class="lbcode">Game code <b id="lbRoomCode"></b></div>
          <p class="lbhint">Give this code to the other players.</p>
          <ul id="lbPlayers"></ul>
          <p id="lbWait"></p>
          <button class="go" id="lbGo">Start</button>
          <button class="link" id="lbLeave">Leave</button>
        </div>
      </div>
      <div class="btns"><button class="go off" id="playBtn">Back to the lobby</button></div>
    </div>
  </div>
</div>
<style>
#app{grid-template-columns:1fr!important;grid-template-rows:1fr auto!important}
#mapwrap{grid-row:1!important}
#panel{grid-row:2;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;overflow:hidden}
/* the control bar has one fixed layout. On a narrower window the whole bar is scaled down, so nothing moves or wraps */
#hud{width:1400px;flex:0 0 auto;zoom:var(--hudz,1)}
body.cover #panel{display:none}
#tipRow{display:flex;align-items:center;gap:16px;padding:0 20px;height:66px;box-sizing:border-box;border-bottom:1px solid var(--line);background:var(--panel2)}
#tipRow.off{display:none}
#tipRow p{margin:0;flex:1;font-size:17px;color:var(--white);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#mainRow{display:flex;align-items:center;gap:18px;height:84px;padding:0 20px;box-sizing:border-box}
#clockBox{flex:0 0 150px;box-sizing:border-box;align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:16px}
#clockT{font-size:24px;font-weight:700;color:var(--white);line-height:1.1;font-variant-numeric:tabular-nums}
#clockS{font-size:15px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
#clockS.hurry{color:var(--enemy)}
#timer{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#timer.off{display:none}
#timerN{font-size:calc(34px * var(--hudz,1));font-weight:700;line-height:1;color:var(--white);font-variant-numeric:tabular-nums;text-align:center}
#timer.hurry #timerN{animation:tblink 1s steps(1,end) infinite}
@keyframes tblink{50%{opacity:0}}
#info{flex:0 0 360px;min-width:0;font-size:17px;color:var(--ink);line-height:1.3}
#unit{flex:0 0 220px;display:flex;flex-direction:column;gap:4px;min-width:0}
#unitName{font-size:20px;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#unitSub{font-size:15px;color:var(--muted);white-space:nowrap}
#unitSub button{font-size:15px}
#verbs{flex:0 0 472px;display:flex;gap:8px}
#verbs button{height:50px;width:112px;flex:0 0 112px;font-size:18px}
#sys{flex:1 1 0;min-width:0;display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:16px}
button.mini{height:26px;padding:0 10px;font-size:14px;font-weight:600;margin-left:10px;vertical-align:middle;color:var(--ink)}
#cmenu button.mini{height:26px;width:auto;min-width:0;font-size:14px;padding:0 10px;margin-left:10px;text-align:center}
#cmenu .mrow2{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--muted);padding:0 2px 2px;white-space:nowrap}
#lobby{width:420px;max-width:100%}
#lbStart,#lbRoom{display:flex;flex-direction:column;align-items:stretch;gap:12px}
#lbStart.off,#lbRoom.off,#playBtn.off,#lbGo.off{display:none}
#lobby label{font-size:15px;color:var(--muted);text-align:left}
#lobby input{font-family:inherit;font-size:20px;height:46px;padding:0 14px;background:rgba(12,18,24,.9);border:1px solid #2a3a4a;color:var(--white);border-radius:2px;outline:none}
#lobby input:focus{border-color:var(--muted)}
#lobby .lbor{font-size:15px;color:var(--muted)}
#lobby .lbrow{display:flex;gap:10px}#lobby .lbrow input{flex:1;text-transform:uppercase;letter-spacing:.2em}#lobby .lbrow button{width:120px}
#lbMsg,#lbMode,#lbWait,#lobby .lbhint{margin:0;font-size:16px;color:var(--muted)}
#lobby .lbcode{font-size:20px;color:var(--muted)}#lobby .lbcode b{font-size:34px;color:var(--white);letter-spacing:.2em;margin-left:10px}
#lbPlayers{list-style:none;margin:0;padding:0;text-align:left;border-top:1px solid var(--line)}
#lbPlayers li{font-size:19px;color:var(--white);padding:10px 4px;border-bottom:1px solid var(--line)}#lbPlayers li.extra{color:var(--faint)}
#plist{position:absolute;left:14px;top:12px;z-index:3;display:flex;flex-direction:column;gap:4px;padding:8px 12px;background:rgba(12,18,24,.8);border:1px solid var(--line);border-radius:2px;pointer-events:none;zoom:var(--hudz,1)}
#plist.off{display:none}
#plist div{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--white)}#plist div.out{color:var(--faint)}
#plist i{width:9px;height:9px;border-radius:50%;display:inline-block}
button.link{border:0;height:auto;padding:0;font-size:15px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;background:transparent}
</style>

function dist(a,b){const dx=wdx(a,b),dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function fmtList(a){if(a.length<=1)return a.join('');if(a.length===2)return a[0]+' and '+a[1];return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
const CSS_FALLBACK={'--sea':'#080d13','--sea2':'#0d161f','--grid':'#101a24','--white':'#f7fafc','--enemy':'#ff5a3c','--muted':'#7a8c9e','--dead':'#3f4d5a'};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||CSS_FALLBACK[v]||'#000';}
function applySides(z){const tab=z>=1.7?SIDES_NEAR:SIDES_FAR;for(const c of cities){const v=tab[c.n];c.side=v?(v[0]<0?-1:1):1;}}
// neighbours: the three nearest surviving cities, either way round
let adjKey='',adjMap=[];
function rebuildAdj(){const live=cities.filter(c=>c.alive!==false);const m=cities.map(()=>new Set());
  for(const c of live){const near=live.filter(o=>o!==c).sort((a,b)=>dist(c,a)-dist(c,b)).slice(0,3);for(const o of near){m[c.id].add(o.id);m[o.id].add(c.id);}}adjMap=m.map(x=>[...x]);}
for(const c of cities)Object.defineProperty(c,'adj',{get(){const k=cities.map(x=>x.alive===false?0:1).join('');if(k!==adjKey){adjKey=k;rebuildAdj();}return adjMap[this.id];}});

// ---------- tips ----------
let tipsOn=true,tipKey='';const tipSeen=new Set();
const TIPS={
  setup:'Nuclear war has broken out. Each player runs their campaign from a secret headquarters (HQ). Destroy every other HQ to win.',
  round:'Everyone gives their orders at the same time. When the clock runs out, all orders are carried out at once.',
  strike:'A strike destroys the target city and every missile in it. The launch shows everyone where it came from.',
  defend:'A defending city shoots down other players’ missiles that enter its circle, one for each missile it holds. It stays on Defend until you change it.',
  move:'Transports move a missile to a neighbouring city. The other players do not see them.',
  menu:'Click a selected city again, or right-click any city, to see its orders.',
  enemyFire:'A coloured city is one another player has been seen in. They may have moved since.',
  hq:'Your HQ can move to a neighbouring city, but that is the only move you can make that round. While it travels it is out of reach; if the city it is heading for is destroyed first, it is lost.',
  reinforce:'New missiles arrive at the start of each round. They can go in any city you hold, or one next to them.'
};
function tip(k){if(!tipsOn||tipSeen.has(k))return;tipSeen.add(k);tipKey=k;}
$('tipsOff').onclick=()=>{tipsOn=false;tipKey='';};

// ---------- players ----------
// Each player has a number in the order the host started the game with. You are always drawn white;
// the other players get red, amber and blue, in table order.
const PCOL=['#ff5a3c','#f2b33d','#4fc3f7'];
const STEP=1/60;            // the round plays out in fixed steps, so every screen gets the same result
const G={players:[],n:0,me:0,clock:0};
function pcol(p){if(p===G.me)return css('--white');const others=G.players.map((_,i)=>i).filter(i=>i!==G.me);return PCOL[others.indexOf(p)]||PCOL[0];}
function pname(p){return G.players[p]?G.players[p].name:'Someone';}

// ---------- state ----------
function newGame(players,me){
  G.players=players||[];G.n=G.players.length;G.me=me??0;
  for(const c of cities){c.active=false;c.alive=true;c.m=Array(G.n).fill(0);c.df=Array(G.n).fill(false);c.seen={};c.diedBy=-1;c.nextL=Array(G.n).fill(0);}
  Object.assign(G,{hqs:Array(G.n).fill(-1),trips:Array(G.n).fill(null),out:Array(G.n).fill(false),hqOrder:-1,phase:'title',round:0,left:0,t:0,acc:0,
    pending:START,zone:null,sel:-1,mode:'idle',hover:-1,orders:[],baseM:[],flights:[],flashes:[],resEnd:0,line:'',lineAt:-99,summary:'',summarySeen:true,
    log:[],lastAdd:-1,lastTap:{id:-1,at:0},banned:new Set(),repick:'',sent:false,queued:null,tint:0});
  tipSeen.clear();tipKey='';
}
G.hq={get own(){return G.hqs&&G.hqs[G.me]!=null?G.hqs[G.me]:-1},set own(v){G.hqs[G.me]=v;}};
G.trip={get own(){return G.trips?G.trips[G.me]:null}};
// a city as you see it: your own missiles and defence, and the last player seen there
for(const c of cities){
  Object.defineProperty(c,'own',{get(){return this.m?this.m[G.me]||0:0},set(v){if(this.m)this.m[G.me]=v;}});
  Object.defineProperty(c,'def',{get(){return this.df?!!this.df[G.me]:false},set(v){if(this.df)this.df[G.me]=v;}});
  Object.defineProperty(c,'revealed',{get(){return !!seenBy(this)}});
  Object.defineProperty(c,'seenAt',{get(){const s=seenBy(this);return s?s.r:0}});
}
function seenBy(c){if(!c.seen)return null;let best=null;for(const k in c.seen){const p=+k;if(p===G.me||G.out[p])continue;if(!best||c.seen[k]>best.r)best={p,r:c.seen[k]};}return best;}
newGame([],0);
const mine=c=>c&&c.alive&&(c.own>0||G.hq.own===c.id);
const say=t=>{G.line=t;G.lineAt=G.clock;};
const avail=c=>c.def?0:c.own-G.orders.filter(o=>o.from===c.id).length;
function zoneOf(id){const h=cities[id];return new Set([id,...cities.filter(c=>c.alive&&c.id!==id).sort((a,b)=>dist(a,h)-dist(b,h)).slice(0,4).map(c=>c.id)]);}
function reachOf(p){const base=new Set();for(const c of cities){if(c.alive&&c.m[p]>0)base.add(c.id);}
  const hq=G.hqs[p];if(hq>=0&&cities[hq].alive)base.add(hq);const z=new Set(base);for(const id of base)for(const j of cities[id].adj)if(cities[j].alive)z.add(j);return z;}
function reach(){return reachOf(G.me);}
function placeable(c){return G.phase==='setup'?G.zone.has(c.id):reachOf(G.me).has(c.id);}

// ---------- the round played out ----------
function computeZones(f){const a=cities[f.from],b=cities[f.to];const dx=wdx(a,b),dy=b.y-a.y;const L=Math.sqrt(dx*dx+dy*dy)||1;f.zones=[];
  for(const c of cities){if(c.id===f.from)continue;let best=null;
    for(const off of [-W,0,W]){const cx=c.x+off-a.x,cy=c.y-a.y;const ux=dx/L,uy=dy/L;const along=cx*ux+cy*uy;const perp=Math.abs(cx*uy-cy*ux);
      if(perp>RANGE)continue;const back=Math.sqrt(RANGE*RANGE-perp*perp);const d0=Math.max(0,along-back);if(d0>L||along+back<0)continue;const tt=d0/SPEED;if(best===null||tt<best)best=tt;}
    if(best!==null)f.zones.push([c.id,f.start+Math.max(0.15,best)]);}
  f.zones.sort((p,q)=>p[1]-q[1]||p[0]-q[0]);}
function launch(p,kind,from,to){const c=cities[from];const start=Math.max(G.t,c.nextL[p]||0);c.nextL[p]=start+LAUNCH_GAP;
  const f={kind,side:p,from,to,start,fly:dist(c,cities[to])/SPEED,launched:false,done:false};f.t=f.start+f.fly;if(kind==='strike')computeZones(f);G.flights.push(f);}
const posOf=(f,time)=>{const a=cities[f.from],b=cities[f.to];const p=Math.max(0,Math.min(1,(time-f.start)/f.fly));return {x:wrapx(a.x+wdx(a,b)*p),y:a.y+(b.y-a.y)*p};};
function stepFlights(){
  for(const f of G.flights){if(f.done||f.launched||G.t<f.start)continue;f.launched=true;const c=cities[f.from];
    c.m[f.side]=Math.max(0,c.m[f.side]-1);
    if(f.side===G.me||f.kind==='strike'){c.active=true;cities[f.to].active=true;}
    // a launch shows everyone where it came from
    if(f.kind==='strike'){c.seen[f.side]=G.round;if(f.side!==G.me){G.log.push({k:'fired',p:f.side,c:c.n});tip('enemyFire');}}}
  for(const f of G.flights){if(f.kind!=='strike'||f.done||f.icpt||!f.launched)continue;
    for(const [cid,te] of f.zones){if(te>G.t||te>=f.t)continue;const c=cities[cid];if(!c.alive)continue;
      // the first other player defending this city shoots the missile down
      let q=-1;for(let i=0;i<G.n;i++){if(i!==f.side&&!G.out[i]&&c.df[i]&&c.m[i]>0){q=i;break;}}if(q<0)continue;
      c.m[q]--;if(c.m[q]===0)c.df[q]=false;c.seen[q]=G.round;c.active=true;
      f.icpt={start:G.t,meet:G.t+Math.min(0.6,(f.t-G.t)*0.7),from:cid,side:q};break;}}
  for(const f of G.flights){if(!f.icpt||f.done||G.t<f.icpt.meet)continue;f.done=true;const p=posOf(f,f.icpt.meet);G.flashes.push({x:p.x,y:p.y,age:0,kind:'int',side:f.icpt.side});
    if(f.icpt.side===G.me)say('Your interceptor in '+cities[f.icpt.from].n+' shot down a missile from '+pname(f.side)+'.');
    else if(f.side===G.me)say('Your missile to '+cities[f.to].n+' was shot down.');}
  for(const f of G.flights){if(f.done||G.t<f.t)continue;f.done=true;arrive(f);}
  G.flights=G.flights.filter(f=>!f.done);
}
function arrive(f){const t=cities[f.to];
  if(f.kind==='move'){if(t.alive)t.m[f.side]++;return;}
  if(!t.alive)return;const lost=t.m[G.me];if(lost||t.id===G.hq.own)G.log.push({k:'lost',c:t.n,n:lost});
  t.alive=false;for(let i=0;i<G.n;i++){t.m[i]=0;t.df[i]=false;}t.diedBy=f.side;
  G.flashes.push({x:t.x,y:t.y,age:0,kind:'hit',side:f.side});
  const forms=[n=>n+' is off the board.',n=>'Midnight in '+n+'.',n=>'Scratch '+n+'.'];say(forms[Math.floor(Math.random()*forms.length)](t.n));
  if(G.sel===t.id)G.sel=-1;
  for(let i=0;i<G.n;i++){const tr=G.trips[i];if(tr&&!tr.done&&tr.to===t.id)tr.dead=true;}
}
function hqLost(p){const tr=G.trips[p];if(tr)return tr.dead;return G.hqs[p]<0||!cities[G.hqs[p]].alive;}
function startTrip(p,to){const from=G.hqs[p];G.trips[p]={from,to,start:0,t:Math.max(2,dist(cities[from],cities[to])/(SPEED*0.5)),done:false,dead:false};}
function stepTrips(){const mt=G.trips[G.me];if(mt){cities[mt.from].active=true;cities[mt.to].active=true;}
  for(let p=0;p<G.n;p++){const tr=G.trips[p];if(!tr||tr.done||G.t<tr.t)continue;tr.done=true;
    if(cities[tr.to].alive){G.hqs[p]=tr.to;if(p===G.me)say('Your HQ is now in '+cities[tr.to].n+'.');}else tr.dead=true;}}

// ---------- rounds ----------
function startRound(r){
  G.lineAt=-99;G.round=r;G.left=PLAN;G.orders=[];G.hqOrder=-1;G.trips=Array(G.n).fill(null);G.mode='idle';G.sel=-1;G.sent=false;
  G.pending=r>1?reinforcements(r):0;G.baseM=cities.map(c=>c.m[G.me]);
  if(G.out[G.me]){G.pending=0;G.phase='wait';G.sent=true;}else{G.phase='plan';if(r>1)tip('reinforce');}
  G.summarySeen=r===1;Host.roundStarted(r);
}
function placeLeftovers(){if(G.pending>0){const hq=cities[G.hq.own];if(hq&&hq.alive)hq.own+=G.pending;G.pending=0;}}
// what you send when the clock runs out: new missiles, defence, and either an HQ move or your orders
function myRound(){placeLeftovers();const place=[];cities.forEach((c,i)=>{for(let k=c.m[G.me]-(G.baseM[i]||0);k>0;k--)place.push(i);});
  return {place,def:cities.filter(c=>c.alive&&c.df[G.me]).map(c=>c.id),hq:G.hqOrder>=0?G.hqOrder:null,
    orders:G.hqOrder>=0?[]:G.orders.filter(o=>cities[o.from].alive).map(o=>({type:o.type,from:o.from,to:o.to}))};}
function submitRound(){if(G.sent)return;G.sent=true;G.mode='idle';G.phase='wait';Net.sendOrders({t:'orders',round:G.round,p:G.me,data:myRound()});}
function mySetup(){return {hq:G.hq.own,place:cities.filter(c=>c.m[G.me]>0).map(c=>[c.id,c.m[G.me]])};}
function submitSetup(){if(G.sent)return;G.sent=true;G.phase='setwait';Net.sendOrders({t:'setup',p:G.me,data:mySetup()});}
// everyone's orders are in: play the round out
function playRound(all){
  G.flights=[];G.t=0;G.acc=0;for(const c of cities)c.nextL=Array(G.n).fill(0);G.log=[];G.mode='idle';G.sel=-1;G.pending=0;
  for(let p=0;p<G.n;p++){const o=all[p];if(p===G.me||!o)continue;
    for(const id of o.place)cities[id].m[p]++;for(const c of cities)c.df[p]=false;for(const id of o.def)if(cities[id].m[p]>0)cities[id].df[p]=true;}
  for(let p=0;p<G.n;p++){const o=all[p];if(!o||G.out[p])continue;
    if(o.hq!=null&&G.hqs[p]>=0)startTrip(p,o.hq);else for(const x of o.orders)if(cities[x.from].alive)launch(p,x.type,x.from,x.to);}
  G.launched=G.flights.some(f=>f.kind==='strike');G.orders=[];G.hqOrder=-1;G.phase='play';G.lineAt=-99;
  G.resEnd=Math.max(1.5,...G.flights.map(f=>f.t),...G.trips.map(tr=>tr?tr.t:0))+1.2;flyHome();
}
function animDone(){G.phase='await';Host.roundPlayed();if(G.queued){const m=G.queued;G.queued=null;applyNext(m);}}
function snapshot(){return {c:cities.map(c=>[c.alive?1:0,c.m.slice(),c.df.map(x=>x?1:0),Object.assign({},c.seen),c.diedBy]),hqs:G.hqs.slice(),out:G.out.slice()};}
function applySnap(s){s.c.forEach((x,i)=>{const c=cities[i];c.alive=!!x[0];c.m=x[1].slice();c.df=x[2].map(Boolean);c.seen=Object.assign({},x[3]);c.diedBy=x[4];});G.hqs=s.hqs.slice();G.out=s.out.slice();}
// the host's settled state after a round; a player whose HQ is gone is out, and their missiles go with them
function settled(){const s=snapshot();for(let p=0;p<G.n;p++){if(!s.out[p]&&hqLost(p)){s.out[p]=true;for(const x of s.c){x[1][p]=0;x[2][p]=0;}}}return s;}
function applyNext(m){
  if(G.phase==='play'){G.queued=m;return;}
  const wasOut=G.out.slice(),hqWas=G.hqs.slice();applySnap(m.snap);drawPlayers();
  const parts=[];const lost=G.log.filter(x=>x.k==='lost').map(x=>x.c+(x.n?' ('+plural(x.n,'missile')+')':''));
  if(lost.length&&!wasOut[G.me])parts.push('You lost '+fmtList(lost)+'.');
  const by={};for(const x of G.log)if(x.k==='fired'){(by[x.p]=by[x.p]||new Set()).add(x.c);}
  for(const p in by)parts.push(pname(+p)+' fired from '+fmtList([...by[p]])+'.');
  for(let p=0;p<G.n;p++)if(G.out[p]&&!wasOut[p]){const h=hqWas[p]>=0?cities[hqWas[p]].n:'';
    parts.push(p===G.me?'Your HQ'+(h?' in '+h:'')+' was destroyed. You are out.':pname(p)+'’s HQ'+(h?' in '+h:'')+' was destroyed. '+pname(p)+' is out.');}
  if(!parts.length)parts.push(G.launched?'No losses this round.':'Nothing was launched this round.');
  G.summary=parts.join(' ');
  const alive=G.players.map((_,i)=>i).filter(i=>!G.out[i]);
  if(alive.length<=1){end(alive.length?alive[0]:-1);return;}
  startRound(m.round);G.summarySeen=false;
}
// round 1: everyone's HQ and first missiles
function applyBegin(m){
  m.setups.forEach((s,p)=>{if(p===G.me||!s)return;G.hqs[p]=s.hq;for(const [id,k] of s.place)cities[id].m[p]+=k;});
  G.round=0;startRound(1);flyHome();tip('round');
}
function applyRepick(m){
  if(!m.ps.includes(G.me)||G.phase!=='setwait')return;
  const city=cities[m.city];G.banned.add(m.city);
  for(const c of cities)c.m[G.me]=0;G.hq.own=-1;G.zone=null;G.pending=START;G.sent=false;G.phase='setup';
  G.repick='Another player chose '+city.n+' for their HQ. Choose a different city.';
}

// ---------- view ----------
let S=1,T=1,ox=0,oy=0,VW=0,VH=0;const ZMAX=7;
const HOME={x0:60,x1:1380,y0:40,y1:600};
function homeView(){const t=Math.min(VW/(HOME.x1-HOME.x0),VH/(HOME.y1-HOME.y0));return {T:t,ox:VW/2-(HOME.x0+HOME.x1)/2*t,oy:VH/2-(HOME.y0+HOME.y1)/2*t};}
// a change in the map's size (the tips row showing or hiding, a window resize) keeps the map where it is
function hudScale(){document.documentElement.style.setProperty('--hudz',String(Math.min(1,window.innerWidth/1400)));}
window.addEventListener('resize',hudScale);hudScale();
// The map, its dots and its names are all sized from the window, like a game drawn at one size and scaled:
// a smaller window shows the same picture smaller, never more crowded. UIS is that scale for dots and names.
const HOME_T_REF=1400/1320;let UIS=1;
function resize(){const r=cvs.parentElement.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const first=VW===0;
  const oldHome=first?1:homeView().T,cx=first?0:(VW/2-ox)/T,cy=first?0:(VH/2-oy)/T;
  cvs.width=r.width*dpr;cvs.height=r.height*dpr;VW=r.width;VH=r.height;S=Math.min(VW/W,VH/H);ctx.setTransform(dpr,0,0,dpr,0,0);
  UIS=Math.max(1,Math.min(1.5,homeView().T/HOME_T_REF));
  if(first){resetView();return;}
  // keep the same part of the world in the middle, at the same zoom relative to the window
  T=T*homeView().T/oldHome;ox=VW/2-cx*T;oy=VH/2-cy*T;clampView();}
function clampView(){if(T<S)T=S;if(T>S*ZMAX)T=S*ZMAX;const mw=W*T,mh=H*T;if(mw<=VW)ox=(VW-mw)/2;else ox=Math.min(0,Math.max(VW-mw,ox));if(mh<=VH)oy=(VH-mh)/2;else oy=Math.min(0,Math.max(VH-mh,oy));}
function resetView(){const h=homeView();T=h.T;ox=h.ox;oy=h.oy;clampView();}
let fly=null;
function flyTo(c,z){const tT=S*z;fly={t:0,dur:0.7,T0:T,ox0:ox,oy0:oy,T1:tT,tox:VW/2-c.x*tT,toy:VH/2-c.y*tT};}
function flyHome(){const h=homeView();fly={t:0,dur:0.8,T0:T,ox0:ox,oy0:oy,T1:h.T,tox:h.ox,toy:h.oy};}
function stepFly(dt){if(!fly)return;fly.t+=dt;const p=Math.min(1,fly.t/fly.dur);const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;T=fly.T0+(fly.T1-fly.T0)*e;ox=fly.ox0+(fly.tox-fly.ox0)*e;oy=fly.oy0+(fly.toy-fly.oy0)*e;clampView();if(p>=1)fly=null;}
new ResizeObserver(resize).observe(cvs.parentElement);
function toMap(ev){const r=cvs.getBoundingClientRect();return {x:(ev.clientX-r.left-ox)/T,y:(ev.clientY-r.top-oy)/T};}
function sc(c){return {x:ox+c.x*T,y:oy+c.y*T};}
function zoomAt(px,py,k){const nT=Math.max(S,Math.min(S*ZMAX,T*k));k=nT/T;ox=px-(px-ox)*k;oy=py-(py-oy)*k;T=nT;clampView();}

// ---------- city names ----------
const LABEL_FONT='600 12px "Barlow Condensed","Arial Narrow",sans-serif';
let labelCache={key:'',L:[]},labelHits=[];
// which names are on the map right now
function shownNames(){
  const N=new Set(),sel=G.sel>=0?cities[G.sel]:null,planning=G.phase==='plan';
  for(const c of cities)if(mine(c)||c.active||c.revealed||!c.alive)N.add(c.id);
  if(planning){for(const o of G.orders)N.add(o.to);if(G.hqOrder>=0)N.add(G.hqOrder);}
  if(sel)N.add(sel.id);if(G.hover>=0)N.add(G.hover);if(typeof menuFor!=='undefined'&&menuFor>=0)N.add(menuFor);
  return N;}
const labelText=c=>c.n+(G.hq.own===c.id?' HQ':'')+(mine(c)&&c.own>0?': '+c.own:'');
// Every name has one fixed side of its city, worked out once when the game loads.
// Resizing, zooming and scrolling never move it. The side is chosen so that no name covers another name or city
// at any zoom from the smallest screen up, and none runs off the map.
const LABEL_SCALES=[0.9,1,1.2,1.5,2,3];
function labelLayout(){
  if(labelCache.key==='fixed')return labelCache.L;
  ctx.font=LABEL_FONT;const extra=ctx.measureText(' HQ: 00').width;const g=12,h=14;
  // offsets from the city in screen pixels. Names to the right start at a fixed point; names to the left end at one
  const K=cities.map(c=>{const nw=ctx.measureText(c.n).width,w=nw+extra;
    return [{dx:g,dy:0,align:'left',ox:g,oy:-7},{dx:-g,dy:0,align:'right',ox:-g-w,oy:-7},
      {dx:g-2,dy:-10,align:'left',ox:g-2,oy:-17},{dx:g-2,dy:10,align:'left',ox:g-2,oy:3},
      {dx:-g+2,dy:-10,align:'right',ox:-g+2-w,oy:-17},{dx:-g+2,dy:10,align:'right',ox:-g+2-w,oy:3},

// ---------- the panel ----------
function idleCount(){return cities.reduce((a,c)=>a+(c.alive?avail(c):0),0);}
function ui(){
  const setup=G.phase==='setup',plan=G.phase==='plan',playing=G.phase==='play'||G.phase==='await';
  const setwait=G.phase==='setwait',wait=G.phase==='wait',out=G.n>0&&G.out[G.me];
  // clock
  if(setwait){$('clockT').textContent='Setup';$('clockS').textContent='Waiting';$('clockS').className='';}
  else if(wait){$('clockT').textContent='Round '+G.round;$('clockS').textContent=out?'Watching':'Waiting';$('clockS').className='';}
  if(setup){$('clockT').textContent='Setup';$('clockS').textContent=G.hq.own<0?'Choose your HQ':'Place your missiles';$('clockS').className='';}
  else if(plan){$('clockT').textContent='Round '+G.round;$('clockS').textContent=G.pending>0?'Place missiles':'Give orders';$('clockS').className='';}
  else if(playing){$('clockT').textContent='Round '+G.round;$('clockS').textContent='Playing out';$('clockS').className='';}
  // the big round clock over the map
  {const on=plan;$('timer').classList.toggle('off',!on);if(on){const sec=Math.max(0,Math.ceil(G.left));$('timerN').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('timer').classList.toggle('hurry',sec>0&&sec<=5);}}
  // the selected city, or what is waiting to be placed
  let s=G.sel>=0?cities[G.sel]:null;if(s&&!mine(s))s=null;
  const placing=(setup&&G.hq.own>=0)||(plan&&G.pending>0);
  if(placing&&G.pending>0){$('unitName').textContent=G.pending+(G.pending===1?' missile':' missiles');$('unitSub').textContent='to place';}
  else if(plan&&s){$('unitName').textContent=s.n+(G.hq.own===s.id?'  HQ':'');
    const ordered=G.orders.filter(o=>o.from===s.id).length;
    $('unitSub').innerHTML='';$('unitSub').appendChild(document.createTextNode(s.def?plural(s.own,'missile')+', defending':plural(s.own,'missile')+(ordered?(avail(s)>0?', '+avail(s)+' free  ':', all ordered  '):'')));
    if(ordered){const b=document.createElement('button');b.className='mini';b.textContent='Clear orders';b.onclick=()=>{G.orders=G.orders.filter(o=>o.from!==s.id);};$('unitSub').appendChild(b);}}
  else{$('unitName').textContent='';$('unitSub').textContent='';}
  const act=plan&&G.pending===0&&!!s&&G.hqOrder<0;
  {const isHQ=plan&&G.pending===0&&s&&s.id===G.hq.own;$('bHQ').disabled=!isHQ;$('bHQ').textContent=isHQ&&G.hqOrder>=0?'Stay':'Move HQ';$('bHQ').classList.toggle('active',!!(isHQ&&(G.mode==='hq'||G.hqOrder>=0)));}
  $('bStrike').disabled=!(act&&avail(s)>0);$('bMove').disabled=!(act&&avail(s)>0);$('bDefend').disabled=!(act&&s.own>0);
  $('bDefend').textContent=s&&s.def?'Stand down':'Defend';$('bDefend').classList.toggle('active',!!(act&&s.def));
  $('bStrike').classList.toggle('active',act&&G.mode==='strike');$('bMove').classList.toggle('active',act&&G.mode==='move');
  // one line about what matters now
  let t='';const recent=G.clock-G.lineAt<3.5;
  if(setwait)t=recent?G.line:'Waiting for the other players to choose their HQs.';
  else if(wait)t=out?'Your HQ has been destroyed. You are watching the rest of the game.':(G.summary&&!G.summarySeen?G.summary:'Your orders are in. Waiting for the other players.');
  else if(setup)t=G.hq.own<0?(recent?G.line:G.repick||'Click any city to make it your headquarters.'):recent?G.line:G.pending>0?'Your HQ is in '+cities[G.hq.own].n+'. Click a local city to place a missile.':'Right-click a city to take a missile back.';
  else if(playing)t=recent?G.line:out?'You are watching. Round '+G.round+' is playing out.':'Round '+G.round+' is playing out.';
  else if(plan){
    if(G.summary&&!G.summarySeen)t=G.summary;
    else if(recent)t=G.line;
    else if(G.pending>0)t='Click a local city to place your new '+(G.pending===1?'missile.':'missiles.');
    else if(G.hqOrder>=0)t='Your HQ will move to '+cities[G.hqOrder].n+' this round. No other orders can be given.';
    else if(G.mode==='hq'&&s)t='Click a neighbouring city to move your HQ there. It is your only move this round.';
    else if(G.mode==='strike'&&s)t='Click a target for '+s.n+'. Each click fires one missile.';
    else if(G.mode==='move'&&s)t='Click a neighbouring city to transport a missile there from '+s.n+'.';
    else if(!s){const u=idleCount();t=u>0?'Click one of your cities to give it orders.':'Every missile has orders.';}
    else if(s.def)t=s.n+' is defending.';
    else if(s.id===G.hq.own&&avail(s)>0)t='This is your HQ. Firing from here shows the other players where it is.';
    else if(avail(s)>0)t='Strike, Defend or Transport for '+s.n+'.';
    else{const u=idleCount();t=u>0?(u===1?'One missile has':u+' missiles have')+' no orders yet.':'Every missile has orders.';}
  }
  $('info').textContent=t;
  // the tips row keeps its place while tips are on, empty when there is nothing to say, so the controls never move
  const showTip=tipsOn&&(setup||plan||playing||setwait||wait);$('tipRow').classList.toggle('off',!showTip);if(showTip)$('tipText').textContent=tipKey?TIPS[tipKey]:'';
}

function onNet(m){

  if(!Net.started)return;
  if(m.t==='setup'){Host.gotSetup(Host.idx(m.from),m.data);return;}
  if(m.t==='orders'){Host.gotOrders(Host.idx(m.from),m.round,m.data);return;}
  if(m.t==='repick'){if(G.lastRepick===m.n)return;G.lastRepick=m.n;if(m.ps.includes(G.me))Net.last=null;applyRepick(m);return;}
  if(m.t==='begin'){if(G.round!==0||G.phase==='play')return;Net.last=null;applyBegin(m);return;}
  if(m.t==='go'){if(m.round!==G.round||(G.phase!=='plan'&&G.phase!=='wait'))return;Net.last=null;if(!G.sent)placeLeftovers();playRound(m.all);return;}
  if(m.t==='next'){if(m.round<=G.round)return;if(G.phase==='play'){G.queued=m;return;}applyNext(m);return;}
}

// ---------- lobby ----------
const NAME_KEY='warhead-name';
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function newCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function lobbyShow(view){$('overlay').style.display='flex';document.body.classList.add('cover');$('lbStart').classList.toggle('off',view!=='start');$('lbRoom').classList.toggle('off',view!=='room');$('playBtn').classList.toggle('off',view!=='over');}
function lobbyName(){const n=$('lbName').value.trim().slice(0,16);if(!n){$('lbMsg').textContent='Type your name first.';$('lbName').focus();return '';}lsSet(NAME_KEY,n);return n;}
$('lbName').value=lsGet(NAME_KEY);
{const h=(location.hash||'').replace('#','').toUpperCase();if(/^[A-Z]{4}$/.test(h))$('lbCode').value=h;}
$('lbMode').textContent=Net.online()?'':'Online play is not set up in this copy, so games only work between tabs of this browser.';
$('lbCreate').onclick=()=>{const n=lobbyName();if(!n)return;const code=newCode();Net.join(code,n,true);try{history.replaceState(null,'','#'+code);}catch(e){}lobbyShow('room');lobbyDraw();};
$('lbJoin').onclick=()=>{const n=lobbyName();if(!n)return;const code=$('lbCode').value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(code)){$('lbMsg').textContent='A game code is four letters.';return;}
  Net.join(code,n,false);try{history.replaceState(null,'','#'+code);}catch(e){}lobbyShow('room');lobbyDraw();};
$('lbLeave').onclick=()=>{Net.leave();lobbyShow('start');$('lbMsg').textContent='';};
$('lbGo').onclick=()=>{if(!Net.host)return;const ps=Net.peers.slice(0,4);if(ps.length<2)return;Host.reset();Net.send({t:'start',players:ps.map(p=>({id:p.id,name:p.name}))});onNet({t:'start',players:ps.map(p=>({id:p.id,name:p.name}))});};
$('playBtn').onclick=()=>{Net.started=false;Host.reset();$('title').textContent='WARHEAD';$('sub').textContent='“Peace through Strength”';lobbyShow('room');lobbyDraw();};
function lobbyDraw(){if(!Net.code)return;$('lbRoomCode').textContent=Net.code;
  const ul=$('lbPlayers');ul.innerHTML='';const ps=Net.peers;
  ps.forEach((p,i)=>{const li=document.createElement('li');if(i>=4)li.className='extra';li.textContent=p.name+(p.id===ID?' (you)':'')+(p.host?', host':'')+(i>=4?', game full':'');ul.appendChild(li);});
  const myIdx=ps.findIndex(p=>p.id===ID);
  $('lbGo').classList.toggle('off',!Net.host);$('lbGo').disabled=ps.length<2;
  $('lbWait').textContent=Net.host?(ps.length<2?'Waiting for at least one more player to join.':'Start when everyone is here. Up to 4 players.'):myIdx>=4?'This game is full.':'Waiting for the host to start.';}
function beginOnline(players,me){
  newGame(players,me);G.phase='setup';$('overlay').style.display='none';document.body.classList.remove('cover');
  requestAnimationFrame(()=>{resize();resetView();});tip('setup');drawPlayers();}
// the players down the side of the map, in your colours for them
function drawPlayers(){const el=$('plist');el.innerHTML='';if(!G.n){el.classList.add('off');return;}el.classList.remove('off');
  G.players.forEach((p,i)=>{const d=document.createElement('div');if(G.out[i])d.className='out';
    d.innerHTML='<i></i><span></span>';d.firstChild.style.background=pcol(i);d.lastChild.textContent=p.name+(i===G.me?' (you)':'')+(G.out[i]?', out':'');el.appendChild(d);});}
function end(w){G.phase='over';drawPlayers();
  $('title').textContent=w===G.me?'VICTORY':w<0?'DRAW':'DEFEAT';
  $('sub').textContent=w===G.me?'Every other HQ has been destroyed.':w<0?'The last HQs were destroyed in the same round.':pname(w)+' won.';
  $('playBtn').textContent='Back to the lobby';lobbyShow('over');}
lobbyShow('start');

// ---------- loop ----------
let last=performance.now();
function tick(now){requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-last)/1000);last=now;G.clock+=dt;
  if(G.phase==='plan'){G.left-=dt;if(G.left<=0)submitRound();}
  else if(G.phase==='setup'&&G.hq.own>=0){if(G.pending===0){G.go=(G.go??SETUP_GRACE)-dt;if(G.go<=0){G.go=null;submitSetup();}}else G.go=null;}
  else if(G.phase==='play'){G.acc+=dt;while(G.acc>=STEP&&G.phase==='play'){G.acc-=STEP;G.t+=STEP;stepFlights();stepTrips();if(!G.flights.length&&G.t>=G.resEnd)animDone();}}
  Net.tick();Host.tick();
  for(const f of G.flashes)f.age+=dt;G.flashes=G.flashes.filter(f=>f.age<3);
  stepFly(dt);draw();ui();updateMenu();setCursor();
}
resize();resetView();requestAnimationFrame(tick);
// name positions are measured once the map font has loaded
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{labelCache.key='';labelLayout();});
</script>
